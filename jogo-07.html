<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>07 — Proteja o Rei</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><a class="back" href="index.html">← Voltar ao Bloco 1</a><header><h1>07 — ♔ Proteja o Rei</h1><p class="sub">Aprenda a identificar uma casa segura para o Rei.</p></header><section class="card"><div class="top"><span class="badge">Desafio <b id="n">1</b>/6</span><span class="badge">Pontos: <b id="s">0</b></span></div><div class="question">Escolha uma casa que não esteja ameaçada pela peça inimiga.</div><div id="board" class="board"></div><div id="f" class="feedback">Encontre uma casa segura.</div><div class="actions"><button id="reset" class="primary">Novo desafio</button></div></section></main><script>
let n=1,s=0,kr,kc,enemyR,enemyC,safe=[];
const b=document.getElementById("board"),f=document.getElementById("f");
function setup(){b.innerHTML="";safe=[];kr=Math.floor(Math.random()*6)+1;kc=Math.floor(Math.random()*6)+1;do{enemyR=Math.floor(Math.random()*8);enemyC=Math.floor(Math.random()*8)}while(Math.abs(enemyR-kr)<=1&&Math.abs(enemyC-kc)<=1);for(let r=0;r<8;r++)for(let c=0;c<8;c++){let q=document.createElement("div");q.className="square "+((r+c)%2?"dark":"light");if(r===kr&&c===kc)q.textContent="♔";if(r===enemyR&&c===enemyC)q.textContent="♜";if(!(Math.abs(r-kr)<=1&&Math.abs(c-kc)<=1)||r===kr&&c===kc){}else if(Math.abs(r-enemyR)+Math.abs(c-enemyC)>0)safe.push(r+","+c);q.onclick=()=>pick(r,c);b.append(q)}f.textContent="Escolha uma casa vizinha ao Rei.";f.className="feedback";document.getElementById("n").textContent=n}
function pick(r,c){if(Math.abs(r-kr)>1||Math.abs(c-kc)>1||r===kr&&c===kc){f.textContent="❌ O Rei só pode andar uma casa.";f.className="feedback wrong";return}let attacked=(r===enemyR||c===enemyC);if(!attacked){s+=Math.max(0,16);f.textContent="✅ Casa segura!";f.className="feedback correct";document.getElementById("s").textContent=s;if(n<6){n++;setTimeout(setup,700)}else{f.textContent="🎉 Bloco 1 concluído! Pontuação: "+s+"/96";document.getElementById("reset").textContent="Jogar novamente"}}else{f.textContent="❌ Cuidado! Essa casa está na linha da Torre.";f.className="feedback wrong"}}
document.getElementById("reset").onclick=()=>{if(n>=6){n=1;s=0;document.getElementById("s").textContent=0}setup()};setup();
</script></body></html>
