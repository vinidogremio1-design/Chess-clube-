<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>02 — Como se Movimentam?</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><a class="back" href="index.html">← Voltar ao Bloco 1</a><header><h1>♟ 02 — Como se Movimentam?</h1><p class="sub">Escolha a descrição correta.</p></header><section class="card"><div class="top"><span class="badge">Questão <b id="n">1</b>/8</span><span class="badge">Pontos: <b id="s">0</b></span></div><div class="question" id="q"></div><div id="a" class="answers"></div><div id="f" class="feedback"></div><div class="actions"><button id="next" class="primary hidden">Próxima →</button></div></section></main><script>
const Q=[["Como a Torre se movimenta?",["Em linhas retas, na horizontal ou vertical.","Somente em diagonal.","Em L.","Uma casa em qualquer direção."],0],["Como o Bispo se movimenta?",["Em L.","Somente em diagonal.","Somente para frente.","Em qualquer direção, mas só uma casa."],1],["Como o Cavalo se movimenta?",["Em L.","Somente na diagonal.","Em linha reta.","Só uma casa."],0],["Como a Dama se movimenta?",["Só em diagonal.","Horizontal, vertical e diagonal.","Só em L.","Só para frente."],1],["Como o Rei se movimenta?",["Qualquer direção, uma casa por vez.","Em L.","Quantas casas quiser em linha reta.","Somente na diagonal."],0],["Como o Peão branco normalmente avança?",["Para trás.","Para frente, uma casa por vez; pode avançar duas na primeira jogada.","Em L.","Na diagonal para frente."],1],["O Cavalo pode saltar peças?",["Não.","Sim.","Só o Rei pode.","Só quando está em xeque."],1],["O Bispo pode mudar de cor de casa durante a partida?",["Sim, sempre.","Não; permanece nas casas da mesma cor.","Só quando captura.","Somente no primeiro movimento."],1]];
let i=0,s=0,ok=false;function start(){ok=false;$("n").textContent=i+1;$("q").textContent=Q[i][0];$("a").innerHTML="";Q[i][1].forEach((x,j)=>{let b=document.createElement("button");b.textContent=x;b.onclick=()=>ans(j);$("a").append(b)});$("f").textContent="";$("f").className="feedback";$("next").classList.add("hidden");$("s").textContent=s}function ans(j){if(ok)return;ok=true;document.querySelectorAll("#a button").forEach(b=>b.disabled=true);if(j===Q[i][2]){s+=10;$("f").textContent="✅ Correto!";$("f").className="feedback correct"}else{$("f").textContent="❌ Vamos revisar essa regra."; $("f").className="feedback wrong"}$("s").textContent=s;$("next").classList.remove("hidden")}$("next").onclick=()=>{if(i===Q.length-1){$("q").textContent="🎉 Desafio concluído!";$("a").innerHTML="";$("f").textContent="Pontuação: "+s+"/"+Q.length*10;$("next").textContent="Recomeçar";$("next").onclick=()=>location.reload()}else{i++;start()}};start();
</script></body></html>
