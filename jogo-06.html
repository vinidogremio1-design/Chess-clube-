<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>06 — Movimentos da Dama</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><a class="back" href="index.html">← Voltar ao Bloco 1</a><header><h1>06 — ♕ Movimentos da Dama</h1><p class="sub">A Dama pode andar em linha reta ou diagonal.</p></header><section class="card"><div class="top"><span class="badge">Desafios: <b id="n">0</b>/5</span><span class="badge">Pontos: <b id="s">0</b></span></div><div id="board" class="board"></div><div id="f" class="feedback">Clique no destino correto.</div><div class="actions"><button id="reset" class="primary">Novo desafio</button></div></section></main><script>
let score=0,done=0,sr,sc,targetR,targetC;
const board=document.getElementById("board"),f=document.getElementById("f");
function newGame(){board.innerHTML="";f.textContent="Clique no destino correto.";f.className="feedback";sr=Math.floor(Math.random()*8);sc=Math.floor(Math.random()*8);do{targetR=Math.floor(Math.random()*8);targetC=Math.floor(Math.random()*8)}while(!(((r===sr||c===sc)||(Math.abs(r-sr)===Math.abs(c-sc)))&&!(r===sr&&c===sc)));for(let r=0;r<8;r++)for(let c=0;c<8;c++){let x=document.createElement("div");x.className="square "+((r+c)%2?"dark":"light");if(r===sr&&c===sc)x.textContent="♕";x.onclick=()=>clickSquare(r,c);board.append(x)}}
function clickSquare(r,c){if(r===targetR&&c===targetC){score+=20;done++;f.textContent="✅ Excelente! Você encontrou um movimento válido.";f.className="feedback correct";document.getElementById("s").textContent=score;document.getElementById("n").textContent=done;if(done<5)setTimeout(newGame,650);else{f.textContent="🎉 Desafio concluído! "+score+"/100 pontos.";document.getElementById("reset").textContent="Jogar novamente"}}else{f.textContent="❌ Essa não é uma casa possível para movimentos da dama.";f.className="feedback wrong"}}
document.getElementById("reset").onclick=()=>{if(done>=5){score=0;done=0;document.getElementById("s").textContent=0;document.getElementById("n").textContent=0}newGame()};newGame();
</script></body></html>
